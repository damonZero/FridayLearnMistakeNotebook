# Android CI：单元测试 + Debug APK 构建
#
# 构建环境要求 JDK 17+（与项目 sourceCompatibility/jvmTarget = 17 匹配；
# Gradle 8.5 完全支持 JDK 17）。本地开发可用 JBR 21，CI 统一使用 Temurin 17。

name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

# 同分支新推送时自动取消仍在运行的旧任务，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Assemble Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 仓库在 Windows 下开发，gradlew 可能缺少可执行位，先补上
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
